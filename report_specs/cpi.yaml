id: cpi
name_ar: الرقم القياسي لأسعار المستهلك
group: prices
frequency: monthly
description_ar: تغير أسعار السلع والخدمات التي يشتريها المستهلك
headline:
  label_ar: التضخم السنوي
  unit_ar: "%"
  series: {dataset: consumer-price-index_5-2, name: "^الرقم القياسي العام$", measure: rate, period_type: month}
  change: {mode: pp}
  press_release_value: 1.7      # GASTAT press release, October 2026
level1:
  title_ar: التضخم السنوي، الرقم القياسي العام
  unit_ar: "% على أساس سنوي"
  series:
    - {label_ar: التضخم السنوي, dataset: consumer-price-index_5-2, name: "^الرقم القياسي العام$", measure: rate, period_type: month}
level2:
  title_ar: أكبر أقسام الإنفاق وزناً
  kind: line
  unit_ar: "% على أساس سنوي"
  top_by_weight:
    top: 6
    weights: {dataset: consumer-price-index_1-1, measure: weight}
    divisions: [الأغذية والمشروبات, "السكن والمياه والكهرباء والغاز وأنواع الوقود الأخرى", النقل, المطاعم وخدمات الإقامة, الأثاث والأجهزة المنزلية والصيانة الدورية للمنزل, "العناية الشخصية والحماية الاجتماعية والسلع والخدمات الأخرى", المعلومات والاتصالات, الصحة, الملابس والأحذية, الترفيه والرياضة والثقافة, التأمين والخدمات المالية, خدمات التعليم, التبغ]
    series: {dataset: consumer-price-index_5-2, measure: rate, period_type: month}
level3:
  - title_ar: كل أقسام الإنفاق، التغير السنوي
    kind: bars
    unit_ar: "%"
    items: {dataset: consumer-price-index_5-2, measure: rate, period_type: month, names_from: divisions}
  - title_ar: المناطق، التغير السنوي
    kind: bars
    unit_ar: "%"
    items: {dataset: consumer-price-index_4-2, measure: rate, period_type: month, block: 0, exclude: "^(جميع المناطق|معدل التغير السنوي)", min_points: 100}
