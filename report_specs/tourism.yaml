  title_ar: معدل إشغال الغرف في الفنادق
  unit_ar: "%"
  series:
    - {label_ar: الفنادق, dataset: tourism-establishments_1-2, block: 0, name: "^معدل الإشغال في الفنادق$", measure: rate, period_type: quarter, mul: 100}
level2:
  title_ar: الإشغال حسب نوع المرفق
  kind: line
  unit_ar: "%"
  series:
    - {label_ar: الفنادق, dataset: tourism-establishments_1-2, block: 0, name: "^معدل الإشغال في الفنادق$", measure: rate, period_type: quarter, mul: 100}
    - {label_ar: الشقق المخدومة ومرافق أخرى, dataset: tourism-establishments_1-2, block: 0, name: "^معدل الإشغال في الشقق", measure: rate, period_type: quarter, mul: 100}
