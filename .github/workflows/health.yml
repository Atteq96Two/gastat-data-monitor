name: health
# Daily: refresh the release calendar, then check endpoints, site structure, missing scheduled releases and collector freshness.
on:
  schedule:
    - cron: "30 2 * * *"      # 05:30 Riyadh
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Refresh calendar
        run: python gastat/collect.py calendar
      - name: Rebuild web data (freshness depends on today's date)
        run: python gastat/webdata.py
      - name: Commit calendar
        run: |
          git config user.name "gastat-monitor"
          git config user.email "gastat-monitor@users.noreply.github.com"
          git add registry/calendar.json catalog web
          git diff --cached --quiet && exit 0
          git commit -q -m "calendar: daily refresh"
          for i in 1 2 3; do git push -q && exit 0; git pull --rebase -q; done
      - name: Health check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python gastat/collect.py health
      - name: Alert if the health job itself broke
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: 'python gastat/alert.py "Health workflow failed" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'
