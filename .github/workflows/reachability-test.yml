name: Reachability test (one-off)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stats.gov.sa from a GitHub runner
        run: |
          UA="gastat-data-monitor/0.1"
          echo "Runner location:"; curl -s -m 15 https://ipinfo.io/json | grep -E '"(country|org)"' || true
          for u in \
            "https://www.stats.gov.sa/ar/latest-publications" \
            "https://www.stats.gov.sa/o/headless-delivery/v1.0/content-structures/118514/structured-contents?pageSize=1&page=1" \
            "https://www.stats.gov.sa/documents/20117/2435267/WPI_Tables_Oct+2026-AR-EN+%281%29.xlsx"; do
            echo "== $u"
            curl -s -m 60 -A "$UA" -o /tmp/out -w "HTTP %{http_code}  bytes %{size_download}  time %{time_total}s\n" "$u" || echo "curl failed ($?)"
          done
