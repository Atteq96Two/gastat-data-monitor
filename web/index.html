<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرصد الإحصاء</title>
<meta name="description" content="مؤشرات اقتصادية شهرية وربعية من الهيئة العامة للإحصاء، في صفحة واحدة.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>مرصد الإحصاء</h1>
  <p class="credit">المصدر: <a href="https://www.stats.gov.sa" rel="noopener" target="_blank">الهيئة العامة للإحصاء</a></p>
</header>
<main id="home" aria-live="polite"></main>
<footer class="foot">
  <p>البيانات من الهيئة العامة للإحصاء. هذه الصفحة مستقلة وليست موقعاً رسمياً للهيئة.</p>
  <p id="stamp"></p>
</footer>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="overlay" class="overlay" hidden>
  <div class="backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <button class="close" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    <div id="sheet-body"></div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
